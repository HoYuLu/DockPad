<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: transparent;
    overflow: hidden;
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
  }
  #card {
    width: 100%;
    height: 100%;
    padding: 8px;
    border-radius: 13px;
    background: rgba(24, 24, 28, 0.92);
    border: 1px solid rgba(255, 255, 255, 0.16);
    box-shadow: 0 12px 34px rgba(0, 0, 0, 0.52);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #shot {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    border-radius: 7px;
    display: block;
  }
  #shot[src=""] { visibility: hidden; }
</style>
</head>
<body>
  <div id="card"><img id="shot" alt=""></div>
  <script>
    window.dockpad.onPreviewSrc((src) => {
      document.getElementById('shot').src = src || '';
    });
  </script>
</body>
</html>
